<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catatan Belanja</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .header-box {
            border: 2px solid black;
            padding: 15px;
            margin-bottom: 20px;
            background-color: white;
        }
    </style>
</head>

<body>

<div class="container mt-4">

    <!-- HEADER -->
    <div class="header-box text-center">
        <h5><b>UJIAN TENGAH SEMESTER GENAP</b></h5>
        <h6>TAHUN AKADEMIK 2025/2026</h6>
        <hr>
        <p><b>Mata Kuliah:</b> Pengembangan Aplikasi Web I</p>
        <p><b>Nama:</b> ISI NAMA KAMU</p>
        <p><b>NPM:</b> ISI NPM KAMU</p>
    </div>

    <!-- FORM -->
    <div class="card p-3 mb-4">
        <h5>Input Data Barang</h5>
        <input type="text" id="nama" class="form-control mb-2" placeholder="Nama Barang">
        <input type="number" id="jumlah" class="form-control mb-2" placeholder="Jumlah">
        <input type="text" id="ket" class="form-control mb-2" placeholder="Keterangan">
        <button onclick="simpanData()" class="btn btn-primary">Simpan</button>
    </div>

    <!-- DATA -->
    <div class="row" id="output"></div>

</div>

<!-- FOOTER -->
<footer class="text-center mt-5 mb-3">
    <small>
        Menggunakan Bootstrap 5 |
        Gambar dari https://unsplash.com |
        © 2026
    </small>
</footer>

<script>
function tampilData() {
    let data = localStorage.getItem("belanja");

    if (data == null) {
        data = [];
    } else {
        data = JSON.parse(data);
    }

    let tampil = "";

    for (let i = 0; i < data.length; i++) {
        tampil += `
        <div class="col-lg-3 col-md-6 col-12 mb-3">
            <div class="card p-3">
                <h5>${data[i].nama}</h5>
                <p>Jumlah: ${data[i].jumlah}</p>
                <p>${data[i].ket}</p>
            </div>
        </div>
        `;
    }

    document.getElementById("output").innerHTML = tampil;
}

function simpanData() {
    let nama = document.getElementById("nama").value;
    let jumlah = document.getElementById("jumlah").value;
    let ket = document.getElementById("ket").value;

    if (nama == "" || jumlah == "" || ket == "") {
        alert("Isi semua data!");
        return;
    }

    let data = localStorage.getItem("belanja");

    if (data == null) {
        data = [];
    } else {
        data = JSON.parse(data);
    }

    data.push({
        nama: nama,
        jumlah: jumlah,
        ket: ket
    });

    localStorage.setItem("belanja", JSON.stringify(data));

    document.getElementById("nama").value = "";
    document.getElementById("jumlah").value = "";
    document.getElementById("ket").value = "";

    tampilData();
}

tampilData();
</script>

</body>
</html>
